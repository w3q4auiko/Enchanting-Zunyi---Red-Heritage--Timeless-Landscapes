map $http_accept $webp_suffix {
    default "";
    "~*webp" ".webp";
}

proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:10m max_size=1g inactive=60m use_temp_path=off;

server {
    # 基础服务配置 (Basic Server Configuration)
    # 监听标准 HTTP 端口
    listen 80;
    
    # 域名绑定
    # 定义服务器响应的域名列表，支持主域名及 www 子域名
    server_name zuimeizy.city www.zuimeizy.city;

    # 安全性配置：隐藏 Nginx 版本号，减少被扫描攻击的风险
    server_tokens off;

    # 传输配置：设置客户端请求体最大允许大小
    # 与后端请求体上限保持一致，单图再由业务层限制为 5MB。
    client_max_body_size 8M;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    etag on;
    if_modified_since exact;
    open_file_cache max=10000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    
    # 前端静态资源路由 (Frontend Static Assets)
    
    location / {
        # 指定静态文件根目录，对应 Docker 容器内的挂载路径
        root /usr/share/nginx/html;
        
        # 设置默认索引文件
        index index.html index.htm;

        # 单页应用 (SPA) 路由策略
        # 核心逻辑：优先查找 $uri 对应的具体文件或目录；
        # 若未找到，则强制回退至 /index.html，交由前端 Vue Router 接管路由渲染。
        # 此配置解决了 History 模式下刷新页面报 404 的问题。
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /sitemap.xml {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /robots.txt {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* ^(/img/.+)\.(png|jpe?g)$ {
        add_header Vary Accept;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $1.webp $uri =404;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    
    # 后端接口反向代理 (Backend API Reverse Proxy)
    
    # ^~ 防止带 .jpg/.webp 后缀的上传图片 URL 被上方静态资源正则拦截。
    location ^~ /api/ {
        # 代理转发目标
        # 使用 Docker 内部服务发现机制，将请求转发至 backend 容器的 5000 端口
        proxy_pass http://backend:5000; 

        # 请求头透传配置 (Header Forwarding)
        # 1. Host: 保留原始请求的主机名
        proxy_set_header Host $host;
        # 2. X-Real-IP: 传递客户端的真实 IP 地址
        proxy_set_header X-Real-IP $remote_addr;
        # 3. X-Forwarded-For: 记录经过代理链的客户端 IP 列表
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 4. X-Forwarded-Proto: 传递原始请求协议 (http/https)
        proxy_set_header X-Forwarded-Proto $scheme;

        # 性能优化：启用 HTTP/1.1 长连接
        # 清除 Connection 头以支持与上游服务器的 Keep-Alive 连接，减少 TCP 握手开销
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # 代理超时设置 (可选优化，防止长请求中断)
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        proxy_cache api_cache;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_methods GET HEAD;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 10s;
        proxy_cache_revalidate on;
        proxy_cache_background_update on;
        proxy_cache_valid 200 10m;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_bypass $http_cache_control $http_pragma $http_authorization;
        proxy_no_cache $http_cache_control $http_pragma $http_authorization;
        add_header X-Cache-Status $upstream_cache_status;
    }
}
